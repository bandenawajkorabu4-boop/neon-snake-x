<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sru ❤️</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Romantic background -->

    <div class="background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="glow glow-three"></div>

        <div class="stars"></div>

        <div class="heart heart-one">♡</div>
        <div class="heart heart-two">♥</div>
        <div class="heart heart-three">♡</div>
        <div class="heart heart-four">♥</div>

    </div>


    <!-- Main website -->

    <main class="main">

        <div class="card" id="card">

            <div class="top-heart">
                ♡
            </div>

            <p class="eyebrow">
                HEY SRU... 👀
            </p>

            <h1 id="title">
                Sru ❤️
                <span>I need to tell you something.</span>
            </h1>

            <p class="description" id="description">
                Don't get excited.
                It might be important...
                or I might just be here to annoy you. 😌
            </p>

            <div id="content"></div>

            <button id="startButton">
                Okay, tell me 👀
            </button>

            <p class="warning" id="warning">
                *You clicked this willingly. That's already suspicious.*
            </p>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
